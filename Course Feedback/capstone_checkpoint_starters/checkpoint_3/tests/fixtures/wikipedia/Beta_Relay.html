<p>The <b>Beta Relay</b> is a team race of four runners, held after the <a href="/wiki/Alpha_Sprint">Alpha Sprint</a> and unrelated to <a href="/wiki/Gamma_Jump">Gamma Jump</a>.</p>
<div class="mw-heading mw-heading2"><h2 id="Rules">Rules</h2></div>
<p>Each runner carries a baton for one lap. Dropping the baton means disqualification.</p>
